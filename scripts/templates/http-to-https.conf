# =============================================================================
# 智联生活 · HTTP → HTTPS 跳转片段
#
# 由 scripts/https-enable.sh 拷贝为宿主 ./nginx-extra/redirect/http.conf，
# 经 frontend/nginx.conf 的 `location /` 内 include 生效。
# 只影响「页面路由」；/assets/、/api/、/.well-known/acme-challenge/ 有各自的
# location，不会被跳转（页面一旦走 HTTPS，前端内部请求都是同源相对路径，自然
# 跟着走 HTTPS）。
#
# 恢复纯 HTTP：./scripts/https-enable.sh --disable，或直接删掉宿主
# ./nginx-extra/redirect/http.conf 后 docker exec smartlife-frontend nginx -s reload
# =============================================================================
return 301 https://$host$request_uri;
