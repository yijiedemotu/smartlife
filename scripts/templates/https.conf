# =============================================================================
# 智联生活 · HTTPS（443）站点配置模版
#
# 本文件不直接生效：由 scripts/https-enable.sh 拷贝为宿主
#   ./nginx-extra/http/https.conf
# 容器内以只读方式挂载为 /etc/nginx/conf.d-extra/http/https.conf，
# 被 frontend/nginx.conf 第一行 include 进 http 上下文。
#
# 三个要点：
#   1) 证书由 acme.sh 安装到宿主 ./certs/{fullchain.pem,privkey.pem}，
#      容器内只读挂载在 /etc/nginx/certs/ —— 续签后只需 nginx -s reload。
#   2) 站点功能与 80 端口共用 /etc/nginx/snippets/site.inc，本文件只管 TLS。
#   3) 关闭 HTTPS：./scripts/https-enable.sh --disable（会删除本文件的副本并 reload）。
#
# 修改本模版后需要重跑 ./scripts/https-enable.sh 才会同步到宿主目录。
# =============================================================================
server {
    listen 443 ssl;
    # nginx >= 1.25.1 的新写法；更老的基础镜像改成：listen 443 ssl http2;
    http2 on;
    # 单 443 server 时无需 default_server：IP 访问不会带 SNI，nginx 会用唯一的
    # 这个 server，证书也正好是这张 IP 证书。
    server_name _;

    # ---------- 证书（宿主 ./certs 只读挂载） ----------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ---------- TLS 参数 ----------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 刻意不开 ssl_stapling：Let's Encrypt 的 6 天短期证书不提供 OCSP/CRL 地址，
    # 开启后 nginx 每次都会去取不存在的 OCSP 响应，白刷错误日志。

    # HSTS 默认关闭。原因：IP 地址访问时浏览器本来就会忽略该响应头（RFC 6797 只
    # 针对域名），开了没收益；而一旦将来换成域名，长 max-age 会在证书续签失败的
    # 那几天把用户锁在打不开的 HTTPS 上，无法手动跳过。
    # 域名证书稳定运行一段时间后再按需打开：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------- 站点功能：与 80 端口完全共用 ----------
    include /etc/nginx/snippets/site.inc;

    # ---------- Vue history 路由回退（此处不加 http→https 跳转，否则死循环） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
