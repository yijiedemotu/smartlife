# =============================================================================
# 智联生活 · 生产环境 Nginx 配置（HTTP / 80 入口）
#
# 后端服务名 backend / 端口 8080 由 docker-compose.prod.yml 中的服务名解析。
#
# 站点功能（静态资源 / /api 反向代理 / WebSocket / 接口文档）全部抽到
# /etc/nginx/snippets/site.inc，与 443 端口共用一份，避免两份配置漂移。
#
# HTTPS 由 scripts/https-enable.sh 一键启用，机制是往下面两个目录写配置文件：
#   宿主 ./nginx-extra/http/       → 容器 /etc/nginx/conf.d-extra/http/*.conf     （443 站点）
#   宿主 ./nginx-extra/redirect/   → 容器 /etc/nginx/conf.d-extra/redirect/*.conf （80→443 跳转）
# 目录为空时两个 include 都不生效，即"纯 HTTP"模式，行为与未接入 HTTPS 时完全一致；
# 证书续签只改宿主 ./certs/ 再 reload，不需要重建镜像。
# =============================================================================

# 443 站点（启用 HTTPS 后才有文件；空目录 include 不报错）
include /etc/nginx/conf.d-extra/http/*.conf;

server {
    listen 80;
    server_name _;

    # ---------- ACME http-01 校验目录（Let's Encrypt 签发/续签用） ----------
    # acme.sh 把校验文件写到宿主 ./acme-webroot/.well-known/acme-challenge/<token>，
    # 容器内只读挂载为 /var/www/acme。此 location 必须明文可访问、且不能被
    # 301 跳到 HTTPS（否则证书还没签出来时校验必然失败）。
    # ^~ 前缀优先于 `location /`，所以跳转片段不会影响它。
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/acme;
    }

    include /etc/nginx/snippets/site.inc;

    # ---------- Vue history 路由：找不到文件回退 index.html ----------
    # 启用 HTTPS 后这里会额外加载一行 `return 301 https://$host$request_uri;`
    location / {
        include /etc/nginx/conf.d-extra/redirect/*.conf;
        try_files $uri $uri/ /index.html;
    }
}
