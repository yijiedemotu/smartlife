server:
  port: 8080
  servlet:
    context-path: /api
  # 生产环境建议开启优雅停机，避免容器滚动时请求被硬断
  shutdown: graceful

spring:
  application:
    name: smartlife
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smartlife}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1700000
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 0
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 2
        max-concurrency: 8
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境勿打印 SQL；本地开发用 application-dev.yml 覆盖为 StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/*.xml

smartlife:
  jwt:
    # HS256 密钥（>=32 字节）；生产通过环境变量 SMARTLIFE_JWT_SECRET 注入
    secret: ${SMARTLIFE_JWT_SECRET:smartlife-aggregation-secret-key-0123456789abcdef-2024}
    expire-minutes: ${SMARTLIFE_JWT_EXPIRE_MINUTES:120}
    refresh-threshold-minutes: ${SMARTLIFE_JWT_REFRESH_MINUTES:30}
  seckill:
    # true=Redis+Lua 原子预扣；false=Redisson 分布式锁兜底（演示两种方案）
    lua-enabled: ${SMARTLIFE_SECKILL_LUA:true}
  redisson:
    address: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}

knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  production: ${KNIFE4J_PRODUCTION:false}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:info}
    com.smartlife: ${LOG_LEVEL_APP:info}
    org.springframework.amqp: warn
  file:
    name: ${LOG_FILE:/app/logs/smartlife.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
