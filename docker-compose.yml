# =============================================================================
# 智联生活 · 本地开发基础设施（MySQL8 + Redis7 + RabbitMQ）
#
# 用途：本地开发只跑中间件，后端用 IDE / mvn spring-boot:run 启动，前端 npm run dev
# 用法：docker compose up -d
# 生产部署请使用：docker-compose.prod.yml（全栈容器化，含后端与前端）
# =============================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: smartlife-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: smartlife
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data-dev:/var/lib/mysql
      # 首次初始化自动建表 + 种子数据（含三端角色与商家示例）
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smartlife-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    command: redis-server --appendonly yes

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: smartlife-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"   # 管理台 http://localhost:15672 guest/guest
    volumes:
      - rabbitmq-data-dev:/var/lib/rabbitmq

volumes:
  mysql-data-dev:
  redis-data-dev:
  rabbitmq-data-dev:
